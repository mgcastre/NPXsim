[project]
name = "npxsim"
version = "0.9.3"
description = "A tool to simulate saltwater intrusion through the Neo-Panamax locks."
readme = "README.md"
authors = [
    { name = "M. G. Castrellon", email = "mariag.castrellon@gmail.com" }
]
license = { text = "MIT" }

requires-python = ">=3.11"
dependencies = [
    "datetime>=5.5",
    "gsw>=3.6",
    "logging>=0.4",
    "matplotlib>=3.10",
    "numpy>=2.3",
    "pandas>=2.3",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
